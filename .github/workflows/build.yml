name: Build Health Assessment Audio Tutor

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Smoke Test on Part 1
        run: |
          python scripts/build_audio.py --part 1

      - name: Generate Full 22-Part Audio Tutorial and Master
        run: |
          python scripts/build_audio.py --all

      - name: Verify Audio Outputs & Print Report
        run: |
          ls -lh Health_Assessment_Audio/
          cat Health_Assessment_Audio/build_report.md

      - name: Upload Audio Tutorial Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Health_Assessment_Audio
          path: Health_Assessment_Audio/
          retention-days: 14
